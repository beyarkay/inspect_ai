# Hooks for the pro-ux branch: install with
#   pre-commit install -c .pre-commit-config.pro-ux.yaml
# Kept apart from upstream's .pre-commit-config.yaml so rebases never conflict.
repos:
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]
      - id: ruff-check
        name: ruff check --fix
        entry: uv run --no-sync ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format
        language: system
        types: [python]
      - id: viewer-vitest
        name: vitest (bundled viewer, all tests)
        entry: pnpm -C src/inspect_ai/_view/ts-mono/apps/inspect exec vitest run
        language: system
        pass_filenames: false
        always_run: true
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-json
        exclude: '(^\.vscode/|^tools/vscode/|jsconfig\.json$|tsconfig\.json$)'
      - id: check-yaml
      - id: check-merge-conflict
